# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Spider

on:
  workflow_dispatch:

  schedule:
    # 由于workflow无法修改默认时区，这里设置了UTC时间，对应是北京时间晚上10点
    - cron: "30 14 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 全局强制所有JS Action使用Node24（双重保险，提前适配6月强制切换）
    env:
      TZ: "Asia/Shanghai"
      DEVICEKEY: ${{ secrets.DEVICEKEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v6  # 升级v6，底层node24
      with:
        path: main  
    - name: Set up Python 3.10
      uses: actions/setup-python@v5  # 升级v5，底层node24
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        cd main
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run crawler
      run: |
        cd main
        mkdir artifacts
        cd news
        scrapy crawl cntv
        
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4.4.3  # 最新修复node24兼容的v4小版本
      with:
        name: my-artifact
        path: main/artifacts
        
    - name: Checkout data repo
      uses: actions/checkout@v6  # 统一升级v6
      with:
        repository: hjue/xwlb-data
        token: ${{ secrets.GH_PAT }}
        path: data
    - name: Get current date
      id: date
      run: echo "current_date=$(date '+%Y-%m-%d')" >> $GITHUB_OUTPUT
    - name: commit file 
      run: |
        cp -r main/artifacts/* data/assets/
        cd data
        git config --global user.email "easyway137@gmail.com"
        git config --global user.name "easyway"
        git add .
        git commit -m "${{ steps.date.outputs.current_date }} update"
        git push